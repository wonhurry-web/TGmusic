# ============================================================
# frp 内网穿透客户端配置（标准 frp v0.52+ TOML 格式）
# 作用：把公网 57899 端口转发到本机 127.0.0.1:6666
# ============================================================

# frp 服务端地址与端口（按你的 frp 服务商填写；若为 SakuraFrp，见 README 的 -f 方式）
serverAddr = "your-frp-server.com"
serverPort = 7000

# 鉴权 token（若服务商提供）。SakurAfrp 用户请改用 -f <访问密钥> 方式启动：
# frpc -f <你的访问密钥>:<隧道ID>   （密钥自行在 SakuraFrp 面板查看，勿提交到仓库）
auth.token = "YOUR_FRP_AUTH_TOKEN"

# ============================================================
# 隧道：一起听同步服务
# ============================================================
[[proxies]]
name = "music"
type = "tcp"
localIP = "127.0.0.1"
localPort = 6666
remotePort = 57899
