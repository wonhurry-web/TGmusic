<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一起听 Logo">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c8ccd4"/>
      <stop offset="100%" stop-color="#8a94a3"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9aa3b0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="300" height="120" rx="26" fill="#0a0a0c"/>
  <rect x="1" y="1" width="298" height="118" rx="25" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g filter="url(#glow)">
    <rect x="68" y="30" width="7" height="52" rx="3.5" fill="url(#silver)"/>
    <path d="M75 30 C 92 33, 100 42, 96 58 C 94 48, 86 41, 75 40 Z" fill="url(#silver)"/>
    <ellipse cx="52" cy="84" rx="21" ry="15" transform="rotate(-20 52 84)" fill="url(#silver)"/>
    <ellipse cx="48" cy="79" rx="11" ry="5" transform="rotate(-20 48 79)" fill="url(#shine)" opacity="0.5"/>
  </g>
  <text x="140" y="76" fill="url(#silverText)" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="46" font-weight="700" letter-spacing="6">一起听</text>
</svg>
